# Package ######################################################################

[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minigrid"
description = "Minimalistic gridworld reinforcement learning environments."
readme = "README.md"
requires-python = ">= 3.11"
authors = [{ name = "Farama Foundation", email = "contact@farama.org" }]
license = { text = "Apache License 2.0" }
keywords = ["Memory, Environment, Agent, RL, Gymnasium"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.18.0", "gymnasium>=0.28.1", "pygame-ce>=2.4.0"]
dynamic = ["version"]

[project.optional-dependencies]
exploration = ["stable-baselines3>=2.7,<3", "PyYAML>=6", "Pillow>=10", "tensorboard>=2.17", "matplotlib>=3.9", "imageio[ffmpeg]>=2.35"]
submission = ["pytest>=8", "pytest-mock>=3.10", "pyinstaller>=6", "reportlab>=4", "pypdf>=5", "pypdfium2>=4", "ruff>=0.11"]
testing = ["pytest>=7.0.1", "pytest-mock>=3.10.0", "matplotlib>=3.0"]
wfc = ["networkx", "imageio>=2.31.1"]

[project.urls]
Homepage = "https://farama.org"
Repository = "https://minigrid.farama.org/"
Documentation = "https://minigrid.farama.org/"
"Bug Report" = "https://github.com/Farama-Foundation/Minigrid/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["minigrid*", "exploration*"]

# Linters and Test tools #######################################################

[tool.black]

[tool.isort]
atomic = true
profile = "black"
append_only = true
src_paths = ["minigrid", "tests"]
add_imports = ["from __future__ import annotations"]

[tool.pyright]
include = ["minigrid/**"]

exclude = ["**/node_modules", "**/__pycache__"]

strict = []

typeCheckingMode = "basic"
pythonVersion = "3.11"
typeshedPath = "typeshed"
enableTypeIgnoreComments = true

# This is required as the CI pre-commit does not download the module (i.e. numpy)
#   Therefore, we have to ignore missing imports
reportMissingImports = "none"

reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportPrivateUsage = "warning"
reportUntypedFunctionDecorator = "none"
reportMissingTypeStubs = false
reportUnboundVariable = "warning"
reportGeneralTypeIssues = "none"
reportPrivateImportUsage = "none"

[tool.pytest.ini_options]
filterwarnings = [
    'ignore:.*step API.*:DeprecationWarning',
] # TODO: to be removed when old step API is removed
