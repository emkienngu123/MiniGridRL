name: Exploration checks

on: [push, pull_request]

jobs:
  cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cpu.lock.txt
      - run: python -m pip install -r requirements-cpu.lock.txt
      - run: python -m ruff check exploration tests_exploration scripts
      - run: python -m pytest tests_exploration -q
      - run: python -m exploration smoke --checkpoint checkpoints/demo.zip
